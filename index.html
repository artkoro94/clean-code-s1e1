<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" type="text/css" media="screen" charset="utf-8">
  </head>
  <body class="page">
    <div class="label-block">
      <img src="./eisenhower-matrix.jpg">
      <a class='more-information' href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </div>
    <div class="main-block">
      <section id="add-element-section">
        <label class="label-style" for="new-task">Add Item</label>
        <div class="task-input">
          <input id="new-task"class="task input-style" type="text">
          <button class="button-style">Add</button>
        </div>
      </section>
      <h3 class="title-h3">Todo</h3>
      <ul class="ul-style" id="incomplete-tasks">
        <li class="li-style">
          <input type="checkbox" class="input-style">
          <label class="task label-style">Pay Bills</label>
          <input type="text" class="task input-style">
          <button class="edit button-style">Edit</button>
          <button class="delete button-style"><img src="./remove.svg"></button>
        </li>
        <li class="edit-mode li-style">
          <input type="checkbox" class="input-style">
          <label class="task label-style">Go Shopping</label>
          <input type="text" value="Go Shopping" class="task input-style">
          <button class="edit button-style">Save</button>
          <button class="delete button-style">
            <img src="./remove.svg">
          </button>
        </li>
      </ul>
      <h3 class="title-h3">Completed</h3>
      <ul class= "ul-style" id="completed-tasks">
        <li class="li-style">
          <input type="checkbox" class="input-style" checked>
          <label class="task label-style">See the Doctor</label>
          <input type="text" class="task input-style">
          <button class="edit button-style">Edit</button>
          <button class="delete button-style">
            <img src="./remove.svg">
          </button>
        </li>
      </ul>
    </div>
    <script src="app.js"></script>
  </body>
</html>
